services:
  - type: web
    name: watermark-detector-pro
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile.minimal
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: MODEL_PATH
        value: /app/best.pt
    healthCheckPath: /health
    autoDeploy: false
    buildFilter:
      paths:
      - backend.py
      - frontend/**
      - Dockerfile.minimal
      - best.pt